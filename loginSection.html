<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="loginSection.css">
</head>
<body>
    
    <div class="loginDiv">
        <h3>Login to your account.</h3>
        <form class="form_box">
            <label for="full name">Full name</label>
            <input type="text" placeholder="Enter your full name" id="full name"><br>

            <label for="username">Username</label>
            <input type="text" placeholder="Enter your username" id="username"><br>

            <label for="password">Password</label>
            <input type="password" placeholder="Enter your password" id="password"><br>

            <button type="submit">Login</button>
        </form>
    </div>


</body>
</html>
